\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"4\",\"lineNum\":0,\"lineType\":1,\"content\":\"十八論\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"5\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428677744410687\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"6\",\"lineNum\":0,\"lineType\":1,\"content\":\"用神，分類定例第一：凡占祖父母、父母、師長家主伯叔、姑姨，與我父母同軰，或與父母年若之親，反及牆城宅舍、舟車、衣服、雨具、求雨紬布、氊貨、章奏、文章、舘室，俱以父母爻爲用神。凡占功名官府、雷電鬼神、丈夫、夫之兄弟同軰，及夫之相與朋友、亂臣盜賊、邪祟、憂疑病症、尸首逆風，俱以官鬼爻爲用神。凡占兄弟、姊妹、姊妹、丈妻之兄弟、世兄弟、結盟同寅\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"7\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428677744443455\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"8\",\"lineNum\":0,\"lineType\":1,\"content\":\"及知交朋友，俱以兄弟爻爲用神。凡占嫂與弟婦妻妾，及友人之妻妾、婢僕、物價、錢財、珠寳、金銀、倉庫、錢糧、什物噐皿，及問天時晴明，俱以妻財爻爲用神。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428677744377919","endPageId":"7358428677744443455","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1660,"chapterOrder":5,"inChapterOrder":1,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705278498","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"9\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡占兒女、孫、姪女壻門生、忠臣、良將、藥材、僧道、六畜、禽鳥、順風、解憂避禍，及問天時、日月星斗，俱以子孫爻爲用神。世應論用神第二：凡卦中世應二爻，世爲自已，應作他人，世應相生相\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"10\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428677744476223\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"11\",\"lineNum\":0,\"lineType\":1,\"content\":\"合，是云賔主相投；世應相剋相冲，可見兩情不睦。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428677744443455","endPageId":"7358428677744476223","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":621,"chapterOrder":5,"inChapterOrder":2,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705294882","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"12\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡占自已疾病，或問壽數，或問出行吉凶，諸凡損益自身者，以世爻爲用也。凡占無尊卑之稱呼，未曾深交之朋友，九流術士、𬽦人敵國，或指實某處地頭，或指此山此水、此寺此塔等類，俱以應爻爲用神也。如占自已有一地可造坟否，則世爲穴塲，應爲對案。如將買他人之地而欲造坟，問此地若葬，益利我家否？以應作穴塲，世是我家也。用神問答第三，\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"13\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428809202335798\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"14\",\"lineNum\":0,\"lineType\":2,\"content\":\"或曰：僕占主。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"15\",\"lineNum\":0,\"lineType\":1,\"content\":\"人以父母爻爲用神，主人占僕不以子。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"16\",\"lineNum\":0,\"lineType\":2,\"content\":\"孫爻爲用神，而以財爻。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"17\",\"lineNum\":0,\"lineType\":1,\"content\":\"爲用神何也？答曰：一切撫養，\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"18\",\"lineNum\":0,\"lineType\":2,\"content\":\"庇䕶我身者。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"19\",\"lineNum\":0,\"lineType\":1,\"content\":\"以父母爻爲用神，卽如城垣、宅舍、舟車、\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"20\",\"lineNum\":0,\"lineType\":2,\"content\":\"衣服等類是也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"21\",\"lineNum\":0,\"lineType\":1,\"content\":\"金銀、物件、婢僕等一切驅使之類，以\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"22\",\"lineNum\":0,\"lineType\":2,\"content\":\"財爻爲用。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"23\",\"lineNum\":0,\"lineType\":1,\"content\":\"神是也。又曰：占兄弟之妻，妻之姊妹以財，\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"24\",\"lineNum\":0,\"lineType\":2,\"content\":\"爻爲用占。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"25\",\"lineNum\":0,\"lineType\":1,\"content\":\"夫之兄弟以官爻爲用，何也？答曰：兄弟之\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"26\",\"lineNum\":0,\"lineType\":2,\"content\":\"妻妻之姊妹。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"27\",\"lineNum\":0,\"lineType\":1,\"content\":\"與妻，同軰人也，旣夫占妻，以財爻爲用，\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"28\",\"lineNum\":0,\"lineType\":2,\"content\":\"皆是財爻。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"29\",\"lineNum\":0,\"lineType\":1,\"content\":\"爲用矣。夫之兄弟，與夫同軰人也，旣妻占\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"30\",\"lineNum\":0,\"lineType\":2,\"content\":\"夫以官。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"31\",\"lineNum\":0,\"lineType\":1,\"content\":\"爻爲用，皆是官爻爲用矣。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428677744476223","endPageId":"7358428809202335798","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":2570,"chapterOrder":5,"inChapterOrder":3,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705311266","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"32\",\"lineNum\":0,\"lineType\":1,\"content\":\"又問：古書俱載兄\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"33\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428677744508991\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"34\",\"lineNum\":0,\"lineType\":1,\"content\":\"弟爲風雲，今以官鬼之爻爲逆風，子孫之爻爲順風，何也？荅曰：貴人以官爲官星，庻人以鬼爲禍祟。貴人以子孫之爻爲惡煞，庻人以子孫之爻爲福神。官乃拘束之星，鬼乃憂疑阻滯之宿。如連日風雨，或遇逆風，疾病纒染，官司擾害，盜賊憂虞，人心豈暢。福神能制官鬼，善解憂愁，故爲之用也。原忌𬽦神論第四凡占卦要知原神，先看用神何爻，生用神之爻，卽是原神也。如用神旬空、月破衰弱，或伏藏不現，得原神\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"35\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428677744541759\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"36\",\"lineNum\":0,\"lineType\":1,\"content\":\"動來生之，或日辰、月建作原神生之，必待用爻出旬出破，得令値日，所求必遂矣。如用神旺相，原神休囚不動，或動而變墓、變絶、變剋、變破、變退，或被日辰、月建剋制，皆不能生用，是用神根蒂被傷矣，是不惟無益而反有損也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428809202335798","endPageId":"7358428677744541759","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1366,"chapterOrder":5,"inChapterOrder":4,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705327650","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"37\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡占卦要知忌神，亦先看用神剋用神之爻，卽是忌神也。如忌神動來剋用，而用爻出現不空，則受剋也。倘卦中又動出一爻，原神生用，則忌神反生原神，是名貪生忘剋，則用神根蒂深固矣，其吉更倍也。如忌\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"38\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428677744574527\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"39\",\"lineNum\":0,\"lineType\":1,\"content\":\"神獨發，而用神旬空，謂之避空；如伏藏不現，謂之避凶；如月建、日辰生用，謂之得救。如是等仍爲吉兆夫。亦何嫌何疑哉？如忌神變回頭之剋，或日辰、月建剋冲之，或動爻制忌之，謂之賊欲害我，是賊先受害也，我又何傷？如日辰、月建生扶忌神，或忌神叠叠剋用，卽使用神避空伏藏者，至出空出透時，便受其毒，難免其灾也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428677744541759","endPageId":"7358428677744574527","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1006,"chapterOrder":5,"inChapterOrder":5,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705344034","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"40\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡占卦要知𬽦神，先看剋制原神，生扶忌神者，卽是𬽦神也。如卦中𬽦神發動，則原神被傷，用神無根，忌\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"41\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428677744607295\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"42\",\"lineNum\":0,\"lineType\":1,\"content\":\"神倍力，其禍可勝道耶？飛神正論第五飛神有六：凡卦旣有伏神，伏神之上者，飛神一也。六獸五類，飛神二也；他宮五類，贅入本宮，取財、官、父兄子，飛神三也。一卦中上下兩爻一類，內靜外興，外飛\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"43\",\"lineNum\":0,\"lineType\":2,\"content\":\"內四\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"44\",\"lineNum\":0,\"lineType\":1,\"content\":\"也。外靜內興，內飛外，五也；內外皆興，飛去六也。伏神正傳第六。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428677744574527","endPageId":"7358428677744607295","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":940,"chapterOrder":5,"inChapterOrder":6,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705360418","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"45\",\"lineNum\":0,\"lineType\":1,\"content\":\"夫伏神\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"46\",\"lineNum\":0,\"lineType\":2,\"content\":\"者，謂\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"47\",\"lineNum\":0,\"lineType\":1,\"content\":\"卦之有缺用神，纔看用神伏于何爻，之\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"48\",\"lineNum\":0,\"lineType\":2,\"content\":\"下旣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"49\",\"lineNum\":0,\"lineType\":1,\"content\":\"有用神現，卽使句空月破，動靜生剋合冲者，皆\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"50\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428677744640063\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"51\",\"lineNum\":0,\"lineType\":1,\"content\":\"由機𨵿之所發，是有病處，必以藥醫之。故空要値日，破要填合，伏待出露，冲待合，合待冲，此乃物窮必變，噐滿則傾。若以破空爲無用，以乾爲坤之伏，大有五類俱全，又扯否卦爲伏，又爻爻有伏之說，豈非病失藥醫，其傳謬矣。至千學者無門可入。今陳一定不易之理，以便學者易丁陞堂。且乾、坤、艮、兌、坎、離、震、巽，乃八宮之首卦，名曰八純，其爻全金、木、水、火土，其象備官、父子、財、兄木宮下七卦，如缺一者，卽以首卦爲伏。假令姤、遁無財，須向乾宮借寅木，遁否、晋、觀缺水移\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"52\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428809202368566\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"53\",\"lineNum\":0,\"lineType\":1,\"content\":\"乾子水伏初爻，觀、剝少金，乾卦申金爲伏，今以乾卦爲法，他宮他卦皆是，以本宮首卦爲下七卦之伏神也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428677744607295","endPageId":"7358428809202368566","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1705,"chapterOrder":5,"inChapterOrder":7,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705376802","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"54\",\"lineNum\":0,\"lineType\":1,\"content\":\"六獸評論第七：靑龍最喜，悅而多仁；附忌神，凡謀不利。白虎最凶，勇而好殺。生用神，諸爲則吉；朱雀剋身，口舌是非常有；如來生用，文書音信當回。勾陳属土，空則田函欠熟；剛强剋世，公差牽扯拘遲。螣蛇怪異虚驚，玄武私情盜賊；白虎血神生産，偏宜發動午官；朱雀化水，何忌\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"55\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428809202401334\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"56\",\"lineNum\":0,\"lineType\":1,\"content\":\"火灾。螣蛇木鬼欺身，恐自縊難逃枷鎖；玄武官生靜世交，小人莫慮千連；世剋靜靑龍廵捕，戲塲酒肆。土鬼動勾陳論祈禱速酬；太歲問病原腫脹黃浮。畧舉六神取用，莫將六獸推尊。遇吉神，般般云吉；持凶宿，件件稱凶。四生逐位論第八：火生于寅也，金生于巳也，水土生于申也，木生于亥也。火庫于戌，絶于亥，金庫于丑，絶于寅，水土庫于辰，絶十巳，木庫于未，絶于申。此長生墓絶定例，卦卦必\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"57\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428677744672831\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"58\",\"lineNum\":0,\"lineType\":2,\"content\":\"用者長生，爻爻須究。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"59\",\"lineNum\":0,\"lineType\":1,\"content\":\"者墓絶，除三者之餘，卦中俱弗\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"60\",\"lineNum\":0,\"lineType\":2,\"content\":\"重也，假今火。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"61\",\"lineNum\":0,\"lineType\":1,\"content\":\"之。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428809202368566","endPageId":"7358428677744672831","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1701,"chapterOrder":5,"inChapterOrder":8,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705393186","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"62\",\"lineNum\":0,\"lineType\":1,\"content\":\"沐浴于卯，爲相生，火之冠帶于辰，衰\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"63\",\"lineNum\":0,\"lineType\":2,\"content\":\"于未。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"64\",\"lineNum\":0,\"lineType\":1,\"content\":\"養于丑爲泄氣。巳火臨官于巳，爲伏吟；午火臨\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"65\",\"lineNum\":0,\"lineType\":2,\"content\":\"官于巳爲\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"66\",\"lineNum\":0,\"lineType\":1,\"content\":\"退神，巳火帝旺于午，爲進神；午火帝旺于\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"67\",\"lineNum\":0,\"lineType\":2,\"content\":\"午爲伏吟。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"68\",\"lineNum\":0,\"lineType\":1,\"content\":\"午，火衰于未者，爲相合；午火病于申，巳午\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"69\",\"lineNum\":0,\"lineType\":2,\"content\":\"火死于酉者。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"70\",\"lineNum\":0,\"lineType\":1,\"content\":\"爲𬽦神，巳火病于申者爲相合；胎于子\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"71\",\"lineNum\":0,\"lineType\":2,\"content\":\"者爲相剋午。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"72\",\"lineNum\":0,\"lineType\":1,\"content\":\"火，胞胎于子，爲剋爲冲，爲反吟。由此觀之，餘神奚足重哉？月破論第九：\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"73\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358436251533328403\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"74\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡卦中月破之爻，乃𨵿因之所現也。動者亦能生剋他爻，變者亦能生剋本爻。目下雖破，出月不破矣；今日雖破，値日不破矣。月破最喜逢合埴實，遠應年月，近應日時，如破而安靜，再値句空衰弱，遇動爻月建、日辰剋害，此等月破，謂之真破，到底破矣。旬空論第十：凡卦中爻遇旬空，乃神機發現于此也。如旺相旬空。或休囚發動，日辰生扶，動爻生扶，動爻變空，伏而旺相，此等旬空，到底有用，不過待其出旬値日，有合空\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"75\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428809202434102\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"76\",\"lineNum\":0,\"lineType\":1,\"content\":\"冲起冲實填補之法，後卷占驗註明。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428677744672831","endPageId":"7358428809202434102","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":2240,"chapterOrder":5,"inChapterOrder":9,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705409570","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"77\",\"lineNum\":0,\"lineType\":1,\"content\":\"如休囚安靜，或日辰剋動爻剋伏而被剋靜，逢月破，値此等句空者，謂之真空，到底空矣。反吟卦定例第十一反吟卦有二：有卦之反吟，有爻之反吟。卦之反吟，卦變相冲也。爻之反吟，爻變相冲也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"78\",\"lineNum\":0,\"lineType\":2,\"content\":\"爻變相冲者，查卦中惟有坤變巽、巽。變坤。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"79\",\"lineNum\":0,\"lineType\":1,\"content\":\"乾卦坐于西北，乾右有戌，乾左有亥。巽卦坐于東南，巽右有辰，巽左有巳，兩卦相對，有辰戌巳亥相冲，故乾爲天卦變。巽爲風卦，巽卦變乾天風。姤卦變風\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"80\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358436251533361171\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"81\",\"lineNum\":0,\"lineType\":1,\"content\":\"天小畜，小畜變姤。此乾、巽二卦相\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"82\",\"lineNum\":0,\"lineType\":2,\"content\":\"冲反，吟卦也，坎卦。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"83\",\"lineNum\":0,\"lineType\":1,\"content\":\"坐于正北。坎下坐子，離卦坐于正，\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"84\",\"lineNum\":0,\"lineType\":2,\"content\":\"南離下坐午兩卦。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"85\",\"lineNum\":0,\"lineType\":1,\"content\":\"相對有子午相冲，故坎爲水卦變離，離爲火卦變坎。水火旣濟變未濟，火水未濟變\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"86\",\"lineNum\":0,\"lineType\":2,\"content\":\"旣濟此坎離，二卦相\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"87\",\"lineNum\":0,\"lineType\":1,\"content\":\"冲，反吟卦也。艮卦坐于東北，艮右有\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"88\",\"lineNum\":0,\"lineType\":2,\"content\":\"丑艮，左有寅坤。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"89\",\"lineNum\":0,\"lineType\":1,\"content\":\"卦，坐于西南，坤右有未，坤左有申，二卦相對，有\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"90\",\"lineNum\":0,\"lineType\":2,\"content\":\"丑未。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"91\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅申相冲，故艮爲山卦變坤。坤爲\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"92\",\"lineNum\":0,\"lineType\":2,\"content\":\"地卦變艮，山地剝。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"93\",\"lineNum\":0,\"lineType\":1,\"content\":\"卦變謙，地山謙卦變剝。此艮、坤二卦相冲，反吟卦也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428809202434102","endPageId":"7358436251533361171","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":2371,"chapterOrder":5,"inChapterOrder":10,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705425954","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"94\",\"lineNum\":0,\"lineType\":1,\"content\":\"震卦坐于正東，震下坐卯，兌卦坐于正，\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"95\",\"lineNum\":0,\"lineType\":2,\"content\":\"西兌下，坐酉。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"96\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428809202466870\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"97\",\"lineNum\":0,\"lineType\":1,\"content\":\"兩卦兩對，有卯酉相冲，故震卦變兌，兌卦變震。雷澤歸妹變隨，澤雷隨卦變歸妹。此震、兌二卦相冲，反吟卦也。子變午，午變子，丑變未，未變丑，寅變申，申變寅，卯變酉，酉變卯，辰變戌，戌變辰，巳變亥，亥變巳，亦以此變出相冲，乃爻之反吟也。伏吟卦定例第十二。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358436251533361171","endPageId":"7358428809202466870","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":799,"chapterOrder":5,"inChapterOrder":11,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705442338","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"98\",\"lineNum\":0,\"lineType\":1,\"content\":\"伏吟卦有三：乾卦變震，震變乾，无妄變大壯，大壯變无妄。此子寅辰復化子寅辰，午申戌復化午申戌，內外卦之伏吟一也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"99\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428809202499638\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"100\",\"lineNum\":0,\"lineType\":1,\"content\":\"姤卦變恒，恒變姤，遁變小過，小過變遁，否變豫，豫變否，豐變同人，同人變豐，履變歸妹，歸妹變履，解變訟，訟變解，此午申戌復化午申戌，外卦之伏吟二也。大有卦變噬嗑，噬嗑變大有，屯卦變需，需變屯，大畜變頥，頥變大畜，隨變夬，夬變隨，小畜變益，益變小畜，泰變復，復變泰，此子寅辰復變子寅辰，內卦之伏吟三也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"101\",\"lineNum\":0,\"lineType\":2,\"content\":\"伏吟惟乾變震，震變乾，查他卦無伏吟也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"102\",\"lineNum\":0,\"lineType\":1,\"content\":\"旺相休囚論第十三。春令木旺火相，夏令火旺土相，秋令金旺水相，冬令\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"103\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358436251533393939\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"104\",\"lineNum\":0,\"lineType\":1,\"content\":\"水旺木相，四季之月，土旺金相，此八者旺相也。春土金兮，夏金水兮，秋木火兮，冬火土兮，此八者休囚也。凡卦中旺相之爻，倘被日辰及動爻剋制，目下貪榮得令，過時仍受其毒，此旺相者，暫時之用也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428809202466870","endPageId":"7358436251533393939","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1655,"chapterOrder":5,"inChapterOrder":12,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705458722","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"105\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡卦中休囚之爻，如得日辰及動爻生扶，目下雖不能逞志，遇時仍然得意，此休囚者，待時之用也。合中帶剋論第十四。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358436251533393939","endPageId":"7358436251533393939","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":261,"chapterOrder":5,"inChapterOrder":13,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705475106","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"106\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡卦中子爻變丑，戌爻變卯，此子與丑合，卯與戌合，合中帶剋，合三剋七之分。如旺相得月日生扶幇比，\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"107\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358428809202532406\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"108\",\"lineNum\":0,\"lineType\":1,\"content\":\"或卦中動爻生之，是作合論也。如休囚失令，被月日剋之，或卦中動爻剋之，是作剋論也。惟申金化巳火者，卽無月日與動爻相生，不作剋論，乃化合化長生也。倘寅月日占之，是三刑會聚，申被寅冲，則不可以吉論矣。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358436251533393939","endPageId":"7358428809202532406","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":721,"chapterOrder":5,"inChapterOrder":14,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705491490","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"109\",\"lineNum\":0,\"lineType\":1,\"content\":\"合處逢冲，冲中逢合論第十五。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428809202532406","endPageId":"7358428809202532406","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":144,"chapterOrder":5,"inChapterOrder":15,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705507874","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"110\",\"lineNum\":0,\"lineType\":1,\"content\":\"合處逢冲有三：凡得六合變六冲，一也；日月冲爻，二也，動爻變冲，三也。冲中逢合亦有三：凡得六冲變六合，一也；日月合爻，二也，動爻變合，三也。合處逢冲，謀\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"111\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358434540005621801\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"112\",\"lineNum\":0,\"lineType\":1,\"content\":\"雖成而終散；冲中逢合，事已散而復成。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358428809202532406","endPageId":"7358434540005621801","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":568,"chapterOrder":5,"inChapterOrder":16,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705524258","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"113\",\"lineNum\":0,\"lineType\":1,\"content\":\"絶處逢生，剋處逢生論第十六。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358434540005621801","endPageId":"7358434540005621801","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":144,"chapterOrder":5,"inChapterOrder":17,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705540642","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"114\",\"lineNum\":0,\"lineType\":1,\"content\":\"金絶于寅，木絶于申，水土絶于巳，火絶于亥，譬如寅。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"115\",\"lineNum\":0,\"lineType\":2,\"content\":\"日占\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"116\",\"lineNum\":0,\"lineType\":1,\"content\":\"卦金爻絶于寅，如卦中有土爻動而生之，是絶處逢生也。申日占卦，木爻則絶于申，如卦中有水爻動而生之，是絶處逢生也。巳日占卦，水爻則絶于巳，如卦中有金爻動而生之，是絶處逢生也。亥日占卦，火爻則絶于亥，如卦中有木爻動而生之，是絶處逢生。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"117\",\"lineNum\":0,\"lineType\":2,\"content\":\"也，惟巳日。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"118\",\"lineNum\":0,\"lineType\":1,\"content\":\"占卦土爻絶于巳，如月建生扶幇比土\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"119\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358436251533426707\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"120\",\"lineNum\":0,\"lineType\":1,\"content\":\"爻，不謂絶也，謂之日生。如土化出巳，有日月幇比，不云化絶，乃云回頭生也。如月日制土，則是絶于日也，則是化絶于爻也。如酉日占卦，寅爻被剋，卦中有水爻動而生之，是剋處逢生矣。餘例如之。大凡絶處逢生，寒谷逢春；剋處逢生，凶後見吉也。變出進退神論第十七：凡卦中亥變子，丑變辰，寅變卯，辰變未，巳變午，未變戌，申變酉，戌變丑，乃進神也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358434540005621801","endPageId":"7358436251533426707","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1547,"chapterOrder":5,"inChapterOrder":18,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705557026","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"121\",\"lineNum\":0,\"lineType\":1,\"content\":\"進神者，吉凶倍增其勢也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358436251533426707","endPageId":"7358436251533426707","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":138,"chapterOrder":5,"inChapterOrder":19,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705573410","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"122\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358436251533459475\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"123\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡卦中子變亥，戌變未，酉變申，未變辰，午變巳，辰變丑，卯變寅，丑變戌，乃退神也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358436251533459475","endPageId":"7358436251533459475","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":339,"chapterOrder":5,"inChapterOrder":20,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705589794","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"124\",\"lineNum\":0,\"lineType\":1,\"content\":\"退神者，吉凶漸減其威也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358436251533459475","endPageId":"7358436251533459475","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":138,"chapterOrder":5,"inChapterOrder":21,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705606178","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"125\",\"lineNum\":0,\"lineType\":1,\"content\":\"卦有驗不驗論第十八。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358436251533459475","endPageId":"7358436251533459475","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":132,"chapterOrder":5,"inChapterOrder":22,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705622562","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"126\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡人問卦，惟致誠可以感格神明，故齋莊戒謹，指占一事，神前祝告，而後卜之，則是用是原、是忌是𬽦動靜生剋、合冲變化、旬空、月破、月建日辰，研究其理，無不驗也。如卜者不審其本來之心而妄斷之，則理有不通，不驗也。兼問幾事，則數有不逮，不驗也。如姦盜\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"127\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358436251533492243\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"128\",\"lineNum\":0,\"lineType\":1,\"content\":\"邪淫之事，則天有不容，不驗也。或乗便偶占，毫無誠敬，不驗也。又如與人代占，必先說明是何名分，方可就其親疎上下，分别用神，以爲占驗，庻無差誤。假如奴僕代主來占，則以父母爻爲用神，今乃有人自顧。體面不說實情，假托親戚，以致用神看差，雖占無益，不驗也。更或求卜之人，心雖誠敬，或阻干他事，令人代卜，而代卜之人心或不誠，不驗也。又或一事而今日占之，明日又占之，或一人連占四五卦，是再三凟，凟則不告，不驗也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358436251533459475","endPageId":"7358436251533492243","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1247,"chapterOrder":5,"inChapterOrder":23,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705638946","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"129\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358436251533525011\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"130\",\"lineNum\":0,\"lineType\":1,\"content\":\"闢增刪卜易之謬。夫人因事有憂疑，惟卜可決，必致誠求卜神必以吉凶相告，當以生剋制化動靜之理細推，無不應驗。豈李文輝作增刪卜易一書，首章云：此書有十二篇秘法，单敎世之全不知五行生剋之士，亦不必念卦書，只要學會㸃課，就知決斷吉凶，知功名之成敗，知財物之得失，知疾病之生死，知禍福之趨避，種種諸事，槪不必念卦書，則知決斷。乃吾師野鶴老人苦心于世之秘法，萬兩黃金無處求。等語。閱其秘法曰：求名\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"131\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358436251533557779\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"132\",\"lineNum\":0,\"lineType\":1,\"content\":\"以官爻爲用神，以子孫爻爲忌神，不要念卦書，不要看生剋制化、動靜冲合，只要會裝卦，對神禱告曰：我若有功名，求賜官爻持世，卜一卦，官爻不臨世，再卜再卜，又無，再再卜，或明日再卜。倘得官爻持世，固知有名；倘得子孫持世，固知無名。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358436251533525011","endPageId":"7358436251533557779","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1312,"chapterOrder":5,"inChapterOrder":24,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705655330","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"133\",\"lineNum\":0,\"lineType\":1,\"content\":\"求財，見財爻持世則有，見兄弟持世則無。卜病見有用神持世則生，見有忌神持世則死。諸卜皆以用神持世斷吉，忌神持世斷凶。如無用神、忌神持世，必要卜見方止。予想李文輝又愚也，何不以笤爿禱告，聖隂陽爲吉凶斷，更㨗\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"134\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358434540005654569\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"135\",\"lineNum\":0,\"lineType\":1,\"content\":\"徑于此法也。今之厾笤者，豈不値萬萬兩黃金乎？總之，李文輝侮聖人之易，迷後世之途，予故闢之。闢易林補遺伏神之謬凡卦中用神不出現，查變爻有，不必尋伏神矣。倘變爻又無，然後查用神伏于何爻之下，看有提拔，沒有提拔，以定吉凶，無不應驗。其法譬如坤宮，坤爲地卦，六爻五類備全，假使用爻旬空月破、刑冲剋害，卽就其本爻有病者論吉凶。如復、臨、泰、大壯、夬、需、比七卦，倘正卦與變卦皆無用神，卽將坤爲地，卦內用神爲\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"136\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358436251533590547\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"137\",\"lineNum\":0,\"lineType\":1,\"content\":\"伏本卦某爻之下。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358436251533557779","endPageId":"7358436251533590547","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1397,"chapterOrder":5,"inChapterOrder":25,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705671714","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"138\",\"lineNum\":0,\"lineType\":1,\"content\":\"此法乃萬古一定不易，豈如張星元易林補遺總斷所云飛伏在二儀，交換，定然陽伏隂而隂伏陽。乾坤來往換，震巽兩邉求。艮兌相抽取，坎離逓送流等語哉？若據彼將天風姤卦爲地雷復卦之伏神，不知地雷復卦所缺者文書爻，應將本宮首卦爲伏，取坤之二爻巳火文書伏復卦二爻寅木之下，寅木爲飛，巳火爲伏，謂之飛來生伏，如占文書長軰事，屢驗巳日。若據張星元以天風姤卦爲復卦之伏，取姤卦第四爻午火伏復卦第四爻丑土下，妄\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"139\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358434540005687337\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"140\",\"lineNum\":0,\"lineType\":1,\"content\":\"將午火伏丑土泄氣之下爲凶，竟不以巳火伏長生之下爲吉。又如天山遁卦缺子孫，必以乾卦初爻子水子孫伏遁卦初爻辰土之下，水庫居辰，謂之入墓，于飛爻也，看有提拔者吉，無提拔者凶。此亦萬古不易之法。而張星元竟將地澤臨卦第五爻癸亥水伏遁卦第五爻申金之下，則曰用神伏長生之下吉。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358436251533590547","endPageId":"7358434540005687337","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1258,"chapterOrder":5,"inChapterOrder":26,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705688098","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"141\",\"lineNum\":0,\"lineType\":1,\"content\":\"是扯張甲當李乙妄論吉凶。又言用神上卦，如遇旬空月破、刑冲剋害，卽當尋伏。又言歸魂卦皆將本宮第四卦爲伏，據稱大有卦初爻子水子孫値旬空，該將\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"142\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358434540005720105\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"143\",\"lineNum\":0,\"lineType\":1,\"content\":\"天地否卦爲伏神，而否卦六爻之內並無子孫，還是以出現旬空者凶乎？還是以伏卦中沒有用神，無吉無凶乎？畧闢其伏神一二之謬，以示後學。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358434540005687337","endPageId":"7358434540005720105","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":682,"chapterOrder":5,"inChapterOrder":27,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705704482","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"144\",\"lineNum\":0,\"lineType\":1,\"content\":\"闢易林補遺胎養衰病之謬凡卜卦爻，遇長生、沐浴、冠帶、臨官、帝旺、衰病死、墓絶、胎養，卦中所重者長生墓絶。其沐浴、冠帶等七件，各有合冲生剋、扶拱、進退神分别。假如申酉金沐浴于午，金化午，乃回頭剋也；或午日占，乃日辰剋也。如申化酉曰進神，如酉化申曰退神，如金化未戌土曰回\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"145\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358434540005752873\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"146\",\"lineNum\":0,\"lineType\":1,\"content\":\"頭生，如酉化卯曰反吟，申化辰曰回頭生，酉化辰曰化生，合也。生剋制化合冲之間，神機報在。豈張星元以胎養半吉之祥，以衰病半凶之禍，若以胎養半吉之祥，假令巳午火長生于寅，胎于子，寅卯木胎于酉，子亥水養于未，還是化胎養半吉之祥，還是化回頭剋，沒有半吉。如金爻爲用，動化戌土，是回頭生，凡占全吉。若據張星元說衰病半凶之禍。又如午火化未土，是化合。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358434540005720105","endPageId":"7358434540005752873","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1192,"chapterOrder":5,"inChapterOrder":28,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705720866","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"147\",\"lineNum\":0,\"lineType\":1,\"content\":\"諸占欲散者得之見阻，欲成者得之可成。半凶半吉之謬，誤人不淺矣。故闢之。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"148\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358436251533623315\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"149\",\"lineNum\":0,\"lineType\":1,\"content\":\"闢卜筮全書世身之謬下筮全書以子午持世，身居初，丑未持世，身居二，寅申持世，身居三，卯酉持世，身居四，辰戌持世，身居五，巳亥持世，身居六。其註云：持世之辰是子，卽以初爻安世身。如世爻旬空月破、日辰刑冲剋害，不必看世，當察身爻，以身爻代世爻之勞。如身爻吉則言吉，身爻凶則言凶，今人宗之，大誤于事。不知卦中所重者，生剋制化、空破、刑冲動靜，如占自已吉凶，理當推世。以世爲我，以定吉凶是也。倘世爻逢凶，身爻逢吉，還\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"150\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437722228277311\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"151\",\"lineNum\":0,\"lineType\":1,\"content\":\"是在于世之凶乎？還是在于身爻之吉乎？由此觀之，而子午持世，身居初爻，諸謬甚矣。辯天醫星之謬凡占延醫用藥，以應爻爲醫生，以子孫爻爲藥石，此係萬古不易之理。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358434540005752873","endPageId":"7358437722228277311","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1418,"chapterOrder":5,"inChapterOrder":29,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705737250","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"152\",\"lineNum\":0,\"lineType\":1,\"content\":\"今術家不察應爻之有用無用，不看子孫爻之動靜旺衰，竟查天醫星之有無，則曰天醫上卦，服藥有效，醫生可用。或查天醫不上卦，服藥無效，醫生不可用。倘天醫不上卦，而應臨子孫發動有氣，剋鬼生身，竟斷醫生不明，服藥無效，有失先天\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"153\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437722228310079\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"154\",\"lineNum\":0,\"lineType\":1,\"content\":\"之妙㫖。况醫生可寄死生，有關人命，予故辯之。闢妄論本命之謬。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437722228277311","endPageId":"7358437722228310079","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":700,"chapterOrder":5,"inChapterOrder":30,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705753634","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"155\",\"lineNum\":0,\"lineType\":1,\"content\":\"大凡占病，當推用神用神，卽如父占子病吉凶，以子孫爻爲用神類是也。今術家竟不叅究用神生剋制化之理，而以病人之本命論吉凶死活，則曰本命上卦斷之生，本命不上卦斷之死。且如用神受傷無救，而本命上卦，還是斷他用神受傷無救，必死耶？還是斷他本命上卦不死耶？後學不可以病人之本命妄斷吉凶可也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"156\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437722228342847\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"157\",\"lineNum\":0,\"lineType\":1,\"content\":\"辯卜筮全書神煞之謬昔京房作卦書，以神煞斷卦，如出行忌往亡、疾病忌喪車、沐浴、哭聲等煞，醫藥看天醫，求財忌劫煞，詞訟看官符，種種星煞，難以枚舉，以致後學宗之，不執定五行生剋制化，一味以神煞爲憑。至明劉伯溫先生作千金賦云：自古神煞之多端，何如生剋制化之一理。斷易之法，始得歸于正宗矣。辯貴人祿馬之謬。今人多以貴人之爻爲官宦，以祿爻爲俸祿，以驛馬\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"158\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437722228375615\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"159\",\"lineNum\":0,\"lineType\":1,\"content\":\"爲來人，槩以此論。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437722228310079","endPageId":"7358437722228375615","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1430,"chapterOrder":5,"inChapterOrder":31,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705770018","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"160\",\"lineNum\":0,\"lineType\":1,\"content\":\"不知貴人祿馬臨原神用神，當以吉斷。假如卜終身，白虎官爻持世，得貴人臨之，當以武職功名許之。如無貴人并臨，當以病\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"161\",\"lineNum\":0,\"lineType\":2,\"content\":\"患强。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"162\",\"lineNum\":0,\"lineType\":1,\"content\":\"暴斷之。若貴人之爻臨忌神動來剋害，不可以貴人爲吉。如貴人臨官鬼爻持世，不可以官鬼爲禍患言凶。且如下行人，當察用神。如用神臨驛馬動，歸期可訂。如驛馬動而用爻受傷，不可以驛馬斷其來。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437722228375615","endPageId":"7358437722228375615","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":683,"chapterOrder":5,"inChapterOrder":32,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705786402","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"163\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡問俸祿，當以財爻爲用神是也。若棄財爻之吉凶，而獨以祿爻爲俸者，亦謬矣。祿係豐足之神，馬係行動之宿。貴人\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"164\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358434540005785641\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"165\",\"lineNum\":0,\"lineType\":1,\"content\":\"不過分别人品淸高微賤之神，此三者臨吉神是吉，臨凶宿是凶，學者不可槩推。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437722228375615","endPageId":"7358434540005785641","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":550,"chapterOrder":5,"inChapterOrder":33,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705802786","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"166\",\"lineNum\":0,\"lineType\":1,\"content\":\"辯易林補遺應爲他人之謬凡占交疎之常人，當以應爻爲他人，以應爻爲用神也。若異姓兄弟，或父叔之友、子孫之友，必分别稱呼老幼取用神是也，不可槩曰我占他人，以應爻爲用神。予因張星元不論父友子友，皆以應爻爲用神。甚至奴僕妻婢、弟兄父母、叔伯隣長，槩曰我代他占，皆以應爲用神。今據張星元作妻妾奴僕去留章。子以\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"167\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437722228408383\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"168\",\"lineNum\":0,\"lineType\":1,\"content\":\"財爲主，應象爲憑。疾病章云：代卜他人看應爻，若臨月破最難逃。遇冲遇剋身難救，逢旺逢生病必消。生應原神宜發動，剋他忌象怕重交。卦身有氣還須吉，應位逢官禍必招。又有闘毆爭競章云：以世應爲主，生剋爲憑。假如子姪與人闘毆爭競，惟恐受𧇊，故卜，豈可不看子孫爻生剋，竟以世爻爲主，生剋世應爲憑乎？又有詞訟章云：以官爻爲主，父母爻爲憑。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358434540005785641","endPageId":"7358437722228408383","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1217,"chapterOrder":5,"inChapterOrder":34,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705819170","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"169\",\"lineNum\":0,\"lineType\":1,\"content\":\"文詞相訴至公庭，須看官爻父母興，倘然官父二爻動來。剋我，還是以官父二爻動說，有主有憑，是吉乎？還是\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"170\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437722228441151\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"171\",\"lineNum\":0,\"lineType\":1,\"content\":\"剋害我者，是凶乎？今之術家，凡遇代占，則不論尊卑，槩以應爻爲用。凡爲詞訟，獨用官爻，總不論用神生剋制化，予不得不辯之。闢易林補遺月破旬空之謬凡卦中月破之爻，發動旺相，或遇動爻生合，日神生合，或化回頭生合，不過在月內，不能爲吉凶。出月値日合補，亦能吉能凶。張星元言月破無可救解，槩以凶推。凡卦中旬空之爻，或旺相安靜，休囚發動，日辰生合冲之，或變出者，或伏而有提拔者，屢試屢驗，應\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"172\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358434540005818409\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"173\",\"lineNum\":0,\"lineType\":1,\"content\":\"在出旬。不意張星元言旬空之爻，猶如卦中無此一爻也，惟月建臨之，則曰月建不作旬空，日辰不爲月破。致後學一見月破，無可解救，一見旬空，沒有此爻。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437722228408383","endPageId":"7358434540005818409","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1397,"chapterOrder":5,"inChapterOrder":35,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705835554","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"174\",\"lineNum\":0,\"lineType\":1,\"content\":\"又曰：月建不作旬空，註曰：全空、半空。凡陽日遇陽爻，隂日遇隂爻，皆作全空；陽日遇隂爻，隂日遇陽爻，皆作半空。試問如人古病，或得全空者，固知其必死；倘得半空者，還是病人死一半，活一半耶？其謬極至此，不得不闢之。辯互卦\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"175\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437722228473919\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"176\",\"lineNum\":0,\"lineType\":1,\"content\":\"古大聖以蓍草演成一卦，推體象、用象、互象、爻辭，定事之吉凶。體象爲我，用象爲事。卦有內三爻、外三爻，世坐之處爲體，應坐之處爲用。譬如天地否卦，世居內坤第三爻，應居外乾，第六爻，卽以內宮坤卦爲體象，以外宮乾卦爲用象。內坤属土，外乾属金，謂之體去生用不吉。再看互卦，互卦之法，亦以否卦爲例，除上六爻，单，除下初爻拆，從第二爻起，至四爻見拆拆单卽內宮互成艮卦，從三爻至五爻見拆单单，卽外宮互成巽卦，艮卦属土，巽卦属木，木爲乾宮否卦之\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"177\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358434540005851177\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"178\",\"lineNum\":0,\"lineType\":1,\"content\":\"財，如求妻財者得之，謂之用來剋體。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358434540005818409","endPageId":"7358434540005851177","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1487,"chapterOrder":5,"inChapterOrder":36,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705851938","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"179\",\"lineNum\":0,\"lineType\":1,\"content\":\"吉爻辭者，爻見单属陽曰九，爻見拆属隂曰六。卽乾卦初爻，易曰：初九潛龍勿用。又如否卦初爻，易曰：初六，拔茅茹，以其彚，貞吉亨。否之四爻曰：九四有命無咎，疇離祉。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358434540005851177","endPageId":"7358434540005851177","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":339,"chapterOrder":5,"inChapterOrder":37,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705868322","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"180\",\"lineNum\":0,\"lineType\":1,\"content\":\"鬼谷子仙師因易理浩蕩深遠，恐愚人不能叅透，以錢代蓍，卜定財官父兄子生剋制化，分别原用𬽦忌四神刑冲剋害，生扶拱合、動靜空破之法，使後學易覺，吉凶易剖。自後以蓍演易者，不察互體用象爻辭而不靈；以錢卜卦者，用之則不驗。學者宜知蓍演錢卜，斷\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"181\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437722228506687\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"182\",\"lineNum\":0,\"lineType\":1,\"content\":\"法不同，闢易林補遺終身大小限之謬。或爲功名而卜終身有無，或因貧賤而卜終身富貴，或爲無子而卜終身有無，或卜壽夭，或習藝業而卜終身可賴，或爲行道而卜終身可行，或爲弟兄子姪之終身如何，種種卜者，各有用神諸書惟增刪卜易有野鶴論，分占終身之法甚妥。大槩總言卜終身吉凶，宜向六親生剋制化、刑冲剋合、動靜空破之間。是問神必以吉凶之機現于爻，以成敗之機現于卦。憶\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"183\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358434540005883945\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"184\",\"lineNum\":0,\"lineType\":1,\"content\":\"予于戊辰年辰月丙辰日，卜自已終身成敗，得旅之蠱卦。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358434540005851177","endPageId":"7358434540005883945","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1419,"chapterOrder":5,"inChapterOrder":38,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705884706","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"185\",\"lineNum\":0,\"lineType\":1,\"content\":\"彼時祖業豐裕，妄想富貴。此卦子孫朱雀持世，官爻入墓于日，顯然功名不可問也。文書爻伏于世爻隂象之下，顯然早年失慈。卦得六合，財福得合，顯然祖業豐厚。此皆卜卦前之事也。方上有嚴君新婚未幾，後來興廢刑傷，自然有驗。孰知辛未年喪父得子，是年父爻入墓之年也。五爻爲長房，持未土子孫。果得長子。甲戌年生次子。予語一友曰：奇哉！此卦五爻持水，長子属羊，四爻化戌，次子属犬，初爻持辰，必\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"186\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358434540005916713\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"187\",\"lineNum\":0,\"lineType\":1,\"content\":\"末子属龍矣。友曰：土主五數，該有五子。予曰：非也。一重土數主五，以衰旺爲之增減。今子孫多現，理當見一有一。後至丁丑年生一子。友曰：汝言後子属龍，今属牛者何來？予曰：雖得此子，不在數中，恐難養耳。果次年卽天。至庚辰年果得子。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358434540005883945","endPageId":"7358434540005916713","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1177,"chapterOrder":5,"inChapterOrder":39,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705901090","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"188\",\"lineNum\":0,\"lineType\":1,\"content\":\"自甲戌歲，予年二十六，家業漸廢。已卯遠行，壬午二月歸，妻巳故矣。節年顛沛，竟以賣卜爲生。或曰：因何廿六歲顛沛起？予曰：交甲戌年，應財値年旬空，財臨白虎化月破世位逢冲之年，謂合處逢冲也。卯年冲應主財爻，以致夫妻遠\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"189\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437861537873961\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"190\",\"lineNum\":0,\"lineType\":1,\"content\":\"别，妻死不面，妻財爻又受午年之剋也。卯月妻財爻又逢月建冲之，至于賣卜爲業。朱雀持世，卦属離宮，斯文之象。次子無成，白虎戌上子孫値年月日三破，甲申年始得安穩。由此卦觀之，黃金策云：若問成家，嫌六冲之爲卦；要知創業，喜六合之成爻。子之先成後敗者，此也。若以易林補遺，初爻起，每爻各𬋩五年，是大限；初爻起，每爻各値一年，是小限。予廿一歲至廿五歲，大限在五爻，臨未土，子孫廿三歲何致父故？三十一歲至三十五歲，大限在初爻，臨辰土，子孫，三\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"191\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437861537906729\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"192\",\"lineNum\":0,\"lineType\":1,\"content\":\"十四歲，何致剋妻？\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358434540005916713","endPageId":"7358437861537906729","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1461,"chapterOrder":5,"inChapterOrder":40,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705917474","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"193\",\"lineNum\":0,\"lineType\":1,\"content\":\"大限如是，小限可知矣。又曰：變卦𬋩三十歲後，何于廿六歲已先破家？三十五歲至四十歲，大限在第二爻兄弟勾陳處，何以反得安穩？若以互卦\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"194\",\"lineNum\":0,\"lineType\":2,\"content\":\"内見巽。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"195\",\"lineNum\":0,\"lineType\":1,\"content\":\"爲文書，外見兌金爲妻財，而卦中旣互有文書妻財，何至雙親早喪？中年失偶，若依張星。元之法不過惑人曰：終身卦要如是推筭，大限小限，不比尋常小卦，酧謝宜多，究竟禍福吉凶，並無絲毫之驗。後人欲卜終身者，當知興廢大局報于卦，刑傷剋害，際遇機緣報于爻。若年年如是，月月照常，而爻\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"196\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437722228539455\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"197\",\"lineNum\":0,\"lineType\":1,\"content\":\"中不及報應，妄推無准。莫若名利禍福、壽天，逐件分占，便可顯而易見也。學者當用意推詳之。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437861537906729","endPageId":"7358437722228539455","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1162,"chapterOrder":5,"inChapterOrder":41,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705933858","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"198\",\"lineNum\":0,\"lineType\":1,\"content\":\"闢易林補遺家宅之謬斷家宅之謬者，惟易林補遺之說。卽如其以卦分旺相死沒，立春後艮旺震相，巽胎離沒，坤死兌囚，乾休坎廢，春分後震旺巽相等說。又子凡看人宅六者，內外二卦皆臨旺相爻內，總無財官，也主興隆；如臨死囚休廢，總有財官，靑龍天喜，亦無佳兆。試問倘立春後卜得頥、小過、蠱、漸、恒、益等卦，俱値旺相胞胎，必㫁\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"199\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437861537939497\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"200\",\"lineNum\":0,\"lineType\":1,\"content\":\"其皆貴無窮之好。如卜得晋、明夷、臨、萃、北師等卦，必斷其敗壞不止之凶。由此論之，生剋制化之理，烏有竟爲吉凶禍福㨗徑之法，其謬猶可。其大謬者，以官爻爲家主之爻，又以五爻爲家主之爻。倘遇官爻壞，五爻好，則家主之吉凶何分？據云：子孫動則廣進家資，此一句係古法也。雖則不謬，然以官鬼爲家主，則子孫不可動，動則剋傷官爻矣。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437722228539455","endPageId":"7358437861537939497","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1213,"chapterOrder":5,"inChapterOrder":42,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705950242","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"201\",\"lineNum\":0,\"lineType\":1,\"content\":\"若據張星元之論，欲要進家業者，反欲剋傷其父乎？又據云：初爲兒女，與雞鵝井連基地，試問初爻逢凶兒女、雞鵝井泉地基\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"202\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437861537972265\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"203\",\"lineNum\":0,\"lineType\":1,\"content\":\"槩凶矣，豈死雞鵝之家，兒女亦必死乎？井必頺乎？基必破乎？二言妻妾兼猫犬竈及華堂，試問二爻逢凶妻妾猫犬竈與華堂槩凶矣，豈死猫犬之家妻妾亦？必至于死乎？死，妻妾之家，乃囚竈與華堂之碍乎？止陳兩爻之謬，其餘不及盡述。凡卜家宅，當以用神分别明白。後卷有家宅六爻分斷，學者詳之，庻無誤矣。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437861537939497","endPageId":"7358437861537972265","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":871,"chapterOrder":5,"inChapterOrder":43,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705966626","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"204\",\"lineNum\":0,\"lineType\":1,\"content\":\"闢易林補遺婚姻嫁娶之謬一、婚姻嫁娶，惟易林補遺之說最謬。以內外卦世應爻爲主，以隂陽財鬼爻爲憑。凡男卜女家，內卦爲夫，\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"205\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437861538005033\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"206\",\"lineNum\":0,\"lineType\":1,\"content\":\"外卦爲婦，又以世爲夫，應爲婦。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437861537972265","endPageId":"7358437861538005033","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":508,"chapterOrder":5,"inChapterOrder":44,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705983010","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"207\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡女卜男家，以外卦爲夫，內卦爲婦，世爻爲婦，應爻爲夫等說，使後學無定見。假如男家卜婚姻，或遇外卦凶而應爻吉，此婚姻亦好亦不好，究竟可配不可配耶？今人宗之，不問父母叔伯，爲卜子姪女婚，不問兄弟母舅爲卜甥弟女婚，一槩以世應論夫婦。官鬼妻財爲夫婦，不以用神生剋制化之理，定其夫婦之吉凶，大失先天妙㫖。孰知世應財官各有分别，世爻爲我家，應爻爲彼家。女人自卜嫁此郎爲夫，當以官爻爲夫；世爲自已官\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"208\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437861538037801\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"209\",\"lineNum\":0,\"lineType\":1,\"content\":\"世相生相合，官陽世隂，此謂之得地。男人自卜娶此女爲妻，當以財爲婦；世爲自已財世相生相合，財隂世陽，亦謂之得地。或父母尊長軰爲子孫婚，欲配某家女爲媳，以子孫爲用神。世上子孫或陽象子孫，皆指言我家之男也；應上子孫或隂象子孫，皆指言彼之女也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437861538005033","endPageId":"7358437861538037801","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1219,"chapterOrder":5,"inChapterOrder":45,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659705999394","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"210\",\"lineNum\":0,\"lineType\":1,\"content\":\"無冲破，有生合，自然可配，夫婦和諧；無生合，有冲剋，自然夫婦不睦；或休囚或受剋，自然不壽。如父爲子婚，世位而受傷者，自然悖逆而刑翁；財爻而受生者，自然孝順而益姑。或爲弟娶妹嫁者，皆以兄\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"211\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437722228572223\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"212\",\"lineNum\":0,\"lineType\":1,\"content\":\"弟爻爲用神也。曾于午建乙卯日父爲女，擇壻得否？卦安靜一人執此卦問予曰：世隂應陽，官星旺令，卦得六合，日辰持財，財官相生，六爻安靜，是必佳偶乎？予曰：若依張星元論，是佳偶也。子孫伏而旬空，是必無子息也。據予斷，子水子孫伏隂爻未土之下，惟恐令愛不壽耳。其人不然而去。後成姻不久，此女病故。又一人申月甲午日，父爲子擇媳，得復之噬嗑卦。予曰：應爻合成，子孫局生世，不但嫁資豐厚，更可享其孝順之福。後至巳年完婚，果孝順賢淑，贈嫁不凡。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437861538037801","endPageId":"7358437722228572223","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1201,"chapterOrder":5,"inChapterOrder":46,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659706015778","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"213\",\"lineNum\":0,\"lineType\":1,\"content\":\"若\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"214\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358438073820004393\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"215\",\"lineNum\":0,\"lineType\":1,\"content\":\"據張星元之說，官爲夫，此卦寅木夫星月破，又被金局剋，是必剋夫。何完婚已及二十年，翁姑在堂，夫婦和諧，不惟子多，近已得孫矣。後學當如是斷，庻無棄吉就凶，以致誤人婚配也。辯六爻諸占之謬天玄賦以六爻定諸占之例，惟占國事以五爻爲天子之位，家宅以二爻爲宅，五爻爲人，坟墓以五六爻爲氣絶之位。此三者稍近乎理，然亦宜以用神生剋制化斷之。其天時、産育、行人、田禾、求謀、疾病、買賣、詞\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"216\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358437861538070569\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"217\",\"lineNum\":0,\"lineType\":1,\"content\":\"訟、盜賊、闘毆、蠶桑、六畜、出行、鬼神等種種定位，槩不以用神生剋制化之理推斷，惟以定例而決事之吉凶，大失先天之玄妙。卽就其天時，以六爻爲曰，以五爻爲雨，試問晴雨不以子孫、父母爻推之，竟以五爻、六爻爲可決乎？又如初爻爲産母，二爻爲胎孕，試問産母不看用神，胎孕不察子孫，竟以初爻、二爻爲可決吉凶乎？\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437722228572223","endPageId":"7358437861538070569","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":1472,"chapterOrder":5,"inChapterOrder":47,"volumeId":"7358437472243548170","volumeVersion":1},{"paragraphId":"7595205659706032162","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"218\",\"lineNum\":0,\"lineType\":1,\"content\":\"其餘種種之謬，難以盡辯，望後學詳之。卜筮正宗卷之三終\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"219\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7358438073820037161\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7358437861538070569","endPageId":"7358438073820037161","contentEncryptType":0,"translateContent":"","chapterId":"1lpdfpdr8oqhb","dataSize":297,"chapterOrder":5,"inChapterOrder":48,"volumeId":"7358437472243548170","volumeVersion":1}],"volume":{"volumeId":"7358437472243548170","checkType":1},"ssrChapterId":"1lpdfpdr8oqhb","tccData":{"shidian_fe_config":"{\n  \"catalog_merge_config\": {\n    \"LS0026\": [\n      {\n        \"interval\": [\n          \"7393215851819696167\",\n          \"7395200624918265871\"\n        ],\n        \"title\": \"太祖高皇帝實錄\"\n      },\n
